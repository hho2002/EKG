name: KeyGen & Email

on:
  workflow_dispatch: # 手动触发
  schedule:
    - cron: '10 0 1 * *' # 每月自动运行一次
    - cron: '20 0 1 * *' # 每月自动运行一次
    - cron: '10 0 15 * *' # 每月自动运行一次
    - cron: '20 0 15 * *' # 每月自动运行一次

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Generator
        # 将脚本输出重定向到 results.txt 文件
        # 注意：这里假设你的运行命令是 python main.py，请根据实际脚本名调整
        run: |
          python main.py --chrome --account --email-api emailfake --skip-update-check --no-logo --disable-progress-bar > results.txt 2>&1
          #python main.py --auto-detect-browser --account --email-api emailfake --skip-update-check --no-logo --disable-progress-bar --disable-logging > results.txt 2>&1
          cat results.txt # 在日志中也打印一份

      - name: Send Email
        uses: dawidd6/action-send-mail@v7
        with:
          # SMTP 服务器设置 (以 Gmail 为例)
          server_address: smtp.gmail.com
          server_port: 465
          # 这些需要在 GitHub Repo -> Settings -> Secrets 中设置
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: ESET Generated Results - ${{ github.run_id }}
          to: ${{ secrets.MAIL_USERNAME }}
          cc: ${{ secrets.MAIL_USERNAME2 }}
          from: GitHub Actions ESET Bot

          # 发送生成的文本内容
          body: |
            ESET KeyGen 任务已完成。
            生成时间: ${{ github.event.repository.updated_at }}
            详细结果见附件或下方内容：

          # 将生成的文件作为附件发送
          attachments: results.txt,./*ACCOUNTS.txt
